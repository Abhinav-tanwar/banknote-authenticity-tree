name: Validate R analysis
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - run: Rscript -e 'install.packages(c("jsonlite","rpart","mclust","randomForest","glmnet"),repos="https://cloud.r-project.org")'
      - run: Rscript scripts/run.R
      - run: Rscript tests/checks.R
